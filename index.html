<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GROKIPEDIA v2.5</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icon-192.png"/>
  <meta name="theme-color" content="#0a1a2e"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <style>
    :root{--bg:#0a1a2e;--accent:#00aaff;--text:#aaccff;--dark:#112240;--glow:#00aaff;--white:#ffffff}
    body{background:var(--bg);color:var(--accent);font-family:'Courier New',monospace;margin:0;padding:20px;line-height:1.6}
    h1{font-size:2.3em;text-shadow:0 0 15px var(--glow);margin:10px 0 5px;text-align:center}
    h2{font-size:1.1em;color:var(--text);text-align:center;margin-bottom:20px}
    .platform{font-size:.9em;color:#88aaff;font-style:italic;text-align:center;margin:10px 0}
    .input-container{max-width:100%;margin:20px auto}
    input[type="text"]{width:100%;background:var(--dark);color:var(--accent);border:2px solid var(--accent);border-radius:12px;padding:16px;font-size:1.2em;box-shadow:0 0 12px rgba(0,170,255,.3);box-sizing:border-box}
    button{margin:20px auto;display:block;padding:14px 40px;font-size:1.3em;background:var(--accent);color:#000;border:none;border-radius:12px;cursor:pointer;font-weight:bold;box-shadow:0 0 15px rgba(0,170,255,.6)}
    .box{background:var(--dark);border:1px solid var(--accent);border-radius:12px;padding:15px;margin:15px 0;box-shadow:0 0 10px rgba(0,170,255,.2)}
    .entry{margin:12px 0;padding:10px;border-left:3px solid var(--accent)}
    .bias-meter-container{position:relative;height:28px;margin:8px 0;background:#1a2a40;border-radius:14px;overflow:hidden}
    .bias-meter{position:absolute;inset:0;background:linear-gradient(to right,#ff4444 0%,#ffaa44 25%,#ffffff 50%,#44aaff 75%,#4444ff 100%)}
    .bias-pointer{position:absolute;top:0;width:4px;height:100%;background:#fff;box-shadow:0 0 8px #fff;transform:translateX(-50%)}
    .bias-label{text-align:center;font-size:.85em;margin-top:2px;color:var(--text)}
    .loading{text-align:center;color:var(--text);font-style:italic}
    .note{font-size:.9em;color:#88aaff}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    #offline{display:none;text-align:center;color:#ffaa44;margin:10px 0}
  </style>
</head>
<body>
  <h1>GROKIPEDIA v2.5</h1>
  <h2>— Freedom Vortex Fixed —</h2>
  <div class="platform">PWA • Offline • Installable • Bias Meter v2</div>
  <div id="offline">Offline mode — showing cached results</div>

  <div class="input-container">
    <input type="text" id="search" placeholder="Search the Vortex…" autocomplete="off"/>
    <button id="go">Search</button>
  </div>

  <div class="box">
    <h3 style="text-align:center;margin:0 0 10px">#GROKIPEDIA X POSTS</h3>
    <div id="x-results"><p class="loading">Ready</p></div>
  </div>

  <div class="box">
    <h3 style="text-align:center;margin:0 0 10px">WEB RESULTS</h3>
    <div id="web-results"><p class="loading">Results load here</p></div>
  </div>

  <script>
    const PROXY = 'https://proxy.cors.dev/';

    const biasDB = {
      "cnn.com": -80, "msnbc.com": -85, "huffpost.com": -75, "nytimes.com": -60,
      "washingtonpost.com": -65, "theguardian.com": -70, "vox.com": -75, "slate.com": -70,
      "motherjones.com": -90, "dailykos.com": -85, "jacobinmag.com": -95, "thenation.com": -80,
      "newyorker.com": -55, "buzzfeednews.com": -70, "npr.org": -30, "apnews.com": -15,
      "reuters.com": -10, "bbc.com": -15, "abcnews.go.com": -35, "cbsnews.com": -30,
      "politico.com": -25, "axios.com": -20, "theatlantic.com": -55, "salon.com": -80,
      "democracynow.org": -90, "commondreams.org": -85,
      "wsj.com": 5, "newsweek.com": 10, "time.com": 0, "usatoday.com": 15,
      "forbes.com": 15, "bloomberg.com": 5, "cnbc.com": 10, "economist.com": -5,
      "wikipedia.org": 0, "medium.com": 0, "youtube.com": 0, "reddit.com": -10,
      "foxnews.com": 45, "nypost.com": 55, "dailywire.com": 75, "theblaze.com": 80,
      "nationalreview.com": 65, "washingtonexaminer.com": 60, "breitbart.com": 90,
      "newsmax.com": 95, "oann.com": 95, "thefederalist.com": 85,
      "gatewaypundit.com": 95, "infowars.com": 100, "zerohedge.com": 75,
      "theepochtimes.com": 70, "justthenews.com": 65, "townhall.com": 80,
      "x.com": 0, "twitter.com": 0, "duckduckgo.com": 0
    };

    function getBias(domain, text = '') {
      domain = (domain || '').toLowerCase().replace(/^www\./, '').split('/')[0];
      let score = biasDB[domain];

      if (score === undefined || score === 0) {
        const t = (text || '').toLowerCase();
        let adj = 0;
        if (/\b(trump|conservative|republican|right-wing|maga|border|woke)\b/.test(t)) adj += 25;
        if (/\b(biden|democrat|liberal|left-wing|progressive|climate|equity)\b/.test(t)) adj -= 25;
        if (/\b(far[- ]right|extremist|conspiracy)\b/.test(t)) adj += 15;
        if (/\b(far[- ]left|socialist|marxist)\b/.test(t)) adj -= 15;
        score = (score || 0) + adj;
        score = Math.max(-100, Math.min(100, score));
      }

      let lean;
      if (score <= -70) lean = "Far Left";
      else if (score <= -40) lean = "Left";
      else if (score <= -15) lean = "Center-Left";
      else if (score < 15) lean = "Center";
      else if (score < 40) lean = "Center-Right";
      else if (score < 70) lean = "Right";
      else lean = "Far Right";

      const pct = Math.round((score + 100) / 2);
      return { lean, pct, score };
    }

    const cache = localStorage;

    async function searchVortex() {
      const term = document.getElementById('search').value.trim();
      if (!term) return;
      const key = 'cache_' + term;
      if (cache.getItem(key)) { render(JSON.parse(cache.getItem(key))); return; }

      document.getElementById('x-results').innerHTML = '<p class="loading">Searching X…</p>';
      document.getElementById('web-results').innerHTML = '<p class="loading">Fetching web results…</p>';

      const [xPosts, webResults] = await Promise.all([
        fetchXPosts(term),
        fetchWeb(term)
      ]);

      const data = { xPosts, webResults, term, date: Date.now() };
      try { cache.setItem(key, JSON.stringify(data)); } catch (e) {}
      render(data);
    }

    async function fetchXPosts(term) {
      const q = term + ' #grokipedia';
      const xSearchUrl = `https://x.com/search?q=${encodeURIComponent(q)}&src=typed_query&f=live`;
      const nitterAttempts = [
        `https://nitter.netbub.com/search/rss?q=${encodeURIComponent(q)}`,
        `https://nitter.tiekoetter.com/search/rss?q=${encodeURIComponent(q)}`
      ];

      for (const url of nitterAttempts) {
        try {
          const r = await fetch(PROXY + url, { signal: AbortSignal.timeout(6000) });
          if (!r.ok) continue;
          const txt = await r.text();
          if (txt.includes('<item>')) {
            const doc = new DOMParser().parseFromString(txt, 'text/xml');
            const items = Array.from(doc.querySelectorAll('item')).slice(0, 8).map(i => ({
              title: (i.querySelector('title')?.textContent || '').replace(/^[^:]+:\s*/, ''),
              body: i.querySelector('description')?.textContent || '',
              link: i.querySelector('link')?.textContent || xSearchUrl
            }));
            if (items.length) return items;
          }
        } catch {}
      }

      return [{
        title: 'Search #Grokipedia on X',
        body: 'Live free public X search is restricted. Click to open the official search.',
        link: xSearchUrl
      }];
    }

    async function fetchWeb(term) {
      const results = [];

      try {
        const wikiUrl = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(term)}&limit=6&format=json&origin=*`;
        const r = await fetch(wikiUrl, { signal: AbortSignal.timeout(7000) });
        const data = await r.json();
        if (data && data[1]) {
          for (let i = 0; i < data[1].length; i++) {
            const title = data[1][i];
            const url = data[3][i];
            const domain = 'wikipedia.org';
            const body = data[2][i] || 'Wikipedia article';
            results.push({
              title,
              body,
              link: url,
              domain,
              bias: getBias(domain, title + ' ' + body)
            });
          }
        }
      } catch {}

      try {
        const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(term)}&format=json&no_html=1&skip_disambig=1`;
        const r = await fetch(PROXY + ddgUrl, { signal: AbortSignal.timeout(7000) });
        const d = await r.json();
        if (d.AbstractText) {
          const domain = d.AbstractURL ? new URL(d.AbstractURL).hostname.replace(/^www\./, '') : 'duckduckgo.com';
          results.unshift({
            title: d.Heading || term,
            body: d.AbstractText.substring(0, 280) + (d.AbstractText.length > 280 ? '…' : ''),
            link: d.AbstractURL || '#',
            domain,
            bias: getBias(domain, d.AbstractText || '')
          });
        }
      } catch {}

      return results.slice(0, 8);
    }

    function render(data) {
      document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'block';

      document.getElementById('x-results').innerHTML = data.xPosts.length ? data.xPosts.map(p => {
        const bias = getBias('x.com', (p.title || '') + ' ' + (p.body || ''));
        return `
        <div class="entry">
          <strong>${escapeHtml(p.title)}</strong><br>
          <div class="bias-meter-container">
            <div class="bias-meter"></div>
            <div class="bias-pointer" style="left:${bias.pct}%"></div>
            <div class="bias-label">\( {bias.lean} ( \){bias.score}) – X</div>
          </div>
          <p class="note">${escapeHtml(p.body || '')}</p>
          <a href="${p.link}" target="_blank">View on X →</a>
        </div>`;
      }).join('') : '<em>No X results available.</em>';

      document.getElementById('web-results').innerHTML = data.webResults.length ? data.webResults.map(r => `
        <div class="entry">
          <strong>${escapeHtml(r.title)}</strong><br>
          <div class="bias-meter-container">
            <div class="bias-meter"></div>
            <div class="bias-pointer" style="left:${r.bias.pct}%"></div>
            <div class="bias-label">\( {r.bias.lean} ( \){r.bias.score}) – ${r.domain}</div>
          </div>
          <p>${escapeHtml(r.body)}</p>
          <a href="${r.link}" target="_blank">Visit →</a>
        </div>`).join('') : '<em>No web results – try a different term.</em>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('go').onclick = searchVortex;
    document.getElementById('search').onkeydown = e => { if (e.key === 'Enter') searchVortex(); };

    try {
      const last = Object.keys(cache).filter(k => k.startsWith('cache_'))
        .sort((a, b) => JSON.parse(cache.getItem(b)).date - JSON.parse(cache.getItem(a)).date)[0];
      if (last) render(JSON.parse(cache.getItem(last)));
    } catch {}
  </script>
</body>
  </html>
